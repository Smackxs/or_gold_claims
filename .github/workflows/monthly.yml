# Replace the contents of .github/workflows/monthly.yml with this file.
# Four parallel jobs (OR, CA, ID, NV) each build one small database of Active claims; a final job merges them
# into claims_slim.db and publishes it. If any job fails, nothing is published and users keep
# the last good database.
name: Monthly claims DB

on:
  schedule:
    - cron: "0 6 1-3 * *"     # 1st, 2nd, 3rd of each month (2nd/3rd only run if 1st failed)
  workflow_dispatch:          # manual run; always rebuilds

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Skip if already built this month
        id: check
        run: |
          THIS=$(date -u +%Y-%m)
          CUR=$(gh release download latest-data -p manifest.json -O - 2>/dev/null \
                | python3 -c "import sys,json;print(json.load(sys.stdin)['version'][:7])" 2>/dev/null || echo none)
          echo "This month: $THIS   Published: $CUR"
          if [ "$CUR" = "$THIS" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330          # Nevada is ~277,000 claims; the others finish much sooner
    strategy:
      fail-fast: true
      matrix:
        prefix: [OR, CA, ID, NV]  # OR also covers Washington (its claims carry OR case numbers)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build ${{ matrix.prefix }} database (up to 3 attempts, resumes between attempts)
        run: |
          for i in 1 2 3; do
            if python -u build_claims_db.py --prefix ${{ matrix.prefix }}; then exit 0; fi
            echo "Attempt $i failed."
            if [ "$i" -lt 3 ]; then echo "Waiting 10 minutes..."; sleep 600; fi
          done
          echo "All attempts failed."
          exit 1

      - uses: actions/upload-artifact@v6
        with:
          name: claims-${{ matrix.prefix }}
          path: claims_${{ matrix.prefix }}.db
          retention-days: 1

  publish:
    needs: [check, build]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v7
        with:
          pattern: claims-*
          merge-multiple: true      # puts claims_OR.db, claims_CA.db, ... in the working folder

      - name: Merge (checks every state has enough rows)
        run: python -u merge_claims_db.py

      - name: Package and write manifest
        run: |
          python - <<'EOF'
          import sqlite3, gzip, shutil, hashlib, json, datetime, sys
          MIN_ROWS = 200000   # final guard; merge_claims_db.py already checks each state
          n = sqlite3.connect("claims_slim.db").execute("SELECT COUNT(*) FROM claims").fetchone()[0]
          if n < MIN_ROWS:
              sys.exit(f"Only {n} rows - refusing to publish a bad database")
          with open("claims_slim.db", "rb") as f, gzip.open("claims_slim.db.gz", "wb", 9) as g:
              shutil.copyfileobj(f, g)
          sha = hashlib.sha256(open("claims_slim.db", "rb").read()).hexdigest()
          today = datetime.date.today().isoformat()
          json.dump({"version": today, "rows": n, "sha256": sha,
                     "url": "claims_slim.db.gz"}, open("manifest.json", "w"))
          print("Packaged", n, "rows, version", today)
          EOF
          ls -l claims_slim.db claims_slim.db.gz

      - name: Publish to release "latest-data"
        run: |
          gh release view latest-data >/dev/null 2>&1 || \
            gh release create latest-data --title "Latest data" --notes "Auto-updated monthly"
          gh release upload latest-data claims_slim.db.gz manifest.json --clobber
